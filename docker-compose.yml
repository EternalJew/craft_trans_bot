services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./media:/media
      - ./backend/static:/app/static   # edit the landing / driver app without rebuilding
    environment:
      DATABASE_URL: sqlite:////app/data/data.db
      MEDIA_ROOT: /media
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    volumes:
      - ./media:/media:ro     # fleet photos for /автопарк
    environment:
      API_BASE: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Public HTTPS tunnel. Off by default — it puts the whole stack, /admin
  # included, on the open internet. Start it deliberately:
  #   docker compose --profile tunnel up -d ngrok
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    command: start --all --config /etc/ngrok.yml
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"   # ngrok's own inspector, and the API tunnel.sh reads
    depends_on:
      - web
    restart: unless-stopped
