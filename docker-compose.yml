services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./media:/media
    environment:
      DATABASE_URL: sqlite:////app/data/data.db
      MEDIA_ROOT: /media
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    volumes:
      - ./media:/media:ro     # fleet photos for /автопарк
    environment:
      API_BASE: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
