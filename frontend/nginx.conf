# HSTS only makes sense once the visitor came over HTTPS. Behind ngrok or a
# TLS-terminating proxy that shows up as X-Forwarded-Proto; on plain http the
# value is empty and nginx skips the header.
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    client_max_body_size 12M;   # parcel photos

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $hsts always;

    # Admin dashboard (SPA — unknown paths fall back to its index.html).
    # A second lock in front of the login form: HTTP basic auth, switched on
    # by ADMIN_BASIC_USER / ADMIN_BASIC_PASSWORD (see docker-entrypoint.d).
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        include /etc/nginx/admin-auth.conf;

        # add_header in a location replaces the server-level set, so repeat it
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security $hsts always;
    }
    location = /admin {
        return 301 /admin/;
    }

    # Landing page, driver Mini App, API and parcel photos
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # reading a book page takes up to two minutes
    }
}
