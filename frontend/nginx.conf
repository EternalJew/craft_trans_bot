server {
    listen 80;
    client_max_body_size 12M;   # parcel photos

    # Admin dashboard (SPA — unknown paths fall back to its index.html)
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }

    # Landing page, driver Mini App, API and parcel photos
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # reading a book page takes up to two minutes
    }
}
